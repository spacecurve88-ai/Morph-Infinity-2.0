name: Open visual builder review
on:
  push:
    branches: [feature/visual-application-builder]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep a reviewable pull request for the requested implementation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --head feature/visual-application-builder --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head feature/visual-application-builder --title "Morph Infinity 2.1: general-purpose visual application builder" --body-file docs/visual-builder-pr.md
          fi
